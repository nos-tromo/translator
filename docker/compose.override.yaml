### Dev-only override: publish backend + frontend to the host.
###
### Production fronts the frontend with the existing reverse proxy and
### relies on the internal `expose` ports in compose.yaml, so this file
### is intentionally *not* loaded by direct
### `docker compose -f docker/compose.yaml` invocations. `make up-dev`
### layers both files so the dev shape is reachable on localhost;
### `make up` runs compose.yaml alone (production shape).

services:
  backend:
    ports:
      - "${TRANSLATOR_BACKEND_HOST_PORT:-8000}:8000"
    environment:
      # No gateway in dev → no request carries X-Auth-User, so set a fallback
      # account here; /translate answers 401 without one. Ignored while
      # TRANSLATOR_EDGE_SECRET is set. Production leaves this unset
      # (fail-closed).
      TRANSLATOR_DEFAULT_IDENTITY: ${TRANSLATOR_DEFAULT_IDENTITY:-dev}
  frontend:
    ports:
      - "${TRANSLATOR_FRONTEND_HOST_PORT:-8501}:8080"
